<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container for luxury tech aesthetic -->
  <rect width="512" height="512" rx="112" fill="#0c0d12" />
  
  <!-- Subtle ambient glow in center -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" />

  <!-- Outer subtle circuit orbital rings -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#6366F1" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Nexus Connection Nodes & Dynamic Interlinking Paths (API Mesh / Hexagonal Gateway) -->
  <g filter="url(#subtleGlow)">
    <!-- Central Master Nexus Node -->
    <circle cx="256" cy="256" r="32" fill="url(#primaryGrad)" />
    <circle cx="256" cy="256" r="16" fill="#FFFFFF" />

    <!-- Connecting Pathways (API Pipes & Synapses) -->
    <!-- Top pathway -->
    <path d="M 256 224 L 256 130" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" />
    <!-- Bottom pathway -->
    <path d="M 256 288 L 256 382" stroke="url(#primaryGrad)" stroke-width="7" stroke-linecap="round" />
    <!-- Top-Right pathway -->
    <path d="M 284 240 L 365 193" stroke="url(#primaryGrad)" stroke-width="7" stroke-linecap="round" />
    <!-- Top-Left pathway -->
    <path d="M 228 240 L 147 193" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" />
    <!-- Bottom-Right pathway -->
    <path d="M 284 272 L 365 319" stroke="url(#primaryGrad)" stroke-width="7" stroke-linecap="round" />
    <!-- Bottom-Left pathway -->
    <path d="M 228 272 L 147 319" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" />

    <!-- Outer Peripheral Service Nodes (Representing REST, GraphQL, Webhooks, gRPC) -->
    <!-- Top Node -->
    <circle cx="256" cy="116" r="22" fill="#141724" stroke="url(#accentGrad)" stroke-width="5" />
    <circle cx="256" cy="116" r="9" fill="#38BDF8" />

    <!-- Bottom Node -->
    <circle cx="256" cy="396" r="22" fill="#141724" stroke="url(#primaryGrad)" stroke-width="5" />
    <circle cx="256" cy="396" r="9" fill="#818CF8" />

    <!-- Top-Right Node -->
    <circle cx="380" cy="184" r="24" fill="#141724" stroke="url(#primaryGrad)" stroke-width="5" />
    <circle cx="380" cy="184" r="10" fill="#6366F1" />

    <!-- Top-Left Node -->
    <circle cx="132" cy="184" r="24" fill="#141724" stroke="url(#accentGrad)" stroke-width="5" />
    <circle cx="132" cy="184" r="10" fill="#38BDF8" />

    <!-- Bottom-Right Node -->
    <circle cx="380" cy="328" r="24" fill="#141724" stroke="url(#primaryGrad)" stroke-width="5" />
    <circle cx="380" cy="328" r="10" fill="#4F46E5" />

    <!-- Bottom-Left Node -->
    <circle cx="132" cy="328" r="24" fill="#141724" stroke="url(#accentGrad)" stroke-width="5" />
    <circle cx="132" cy="328" r="10" fill="#818CF8" />

    <!-- Inter-node perimeter links for mesh cohesion -->
    <path d="M 132 184 L 256 116 L 380 184" fill="none" stroke="#6366F1" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6" />
    <path d="M 132 328 L 256 396 L 380 328" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6" />
    <path d="M 132 184 L 132 328" fill="none" stroke="#818CF8" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6" />
    <path d="M 380 184 L 380 328" fill="none" stroke="#818CF8" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6" />

    <!-- Floating data pulse particles -->
    <circle cx="256" cy="170" r="3.5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="320" cy="220" r="3.5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="190" cy="290" r="3.5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="256" cy="340" r="3.5" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
